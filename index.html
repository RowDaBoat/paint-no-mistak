<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Paint XP</title>
<style>
/* Layout: a Luna-era desktop. The Paint window fills the sky above a taskbar: toolbox | canvas | layers, colour box and status bar below. */
:root{
  --face:#ECE9D8; --hilite:#FFFFFF; --shadow:#ACA899; --dkshadow:#716F64;
  --ink:#000000; --select:#316AC5; --select-ink:#FFFFFF; --workspace:#808080;
  --frame:#0054E3; --field:#7F9DB9; --desk:#3A6EA5;
  --ui: Tahoma, "Segoe UI", Verdana, Geneva, sans-serif;
  --title: "Trebuchet MS", Tahoma, "Segoe UI", sans-serif;
  color-scheme: light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--desk);color:var(--ink);font:11px/1.25 var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:1px dotted #000;outline-offset:-2px}

/* ---------- desktop ---------- */
#desktop{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:
    radial-gradient(ellipse 34% 9% at 72% 20%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 24% 7% at 24% 13%,rgba(255,255,255,.7),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 95% 58% at 32% 108%,#7CC242 0%,#5FA834 50%,#4B9128 69.5%,rgba(75,145,40,0) 70%),
    radial-gradient(ellipse 80% 48% at 100% 112%,#58A030 0%,#3F8722 68%,rgba(63,135,34,0) 68.5%),
    linear-gradient(#2160D3 0%,#4A8DE8 45%,#A5CDF2 78%,#D6EAF9 100%);}
.desk-icon{position:absolute;left:12px;top:12px;width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px;background:none;border:0;color:#fff;cursor:default}
.desk-icon canvas{width:32px;height:32px;image-rendering:pixelated}
.desk-icon span{padding:0 3px;text-shadow:1px 1px 1px #000}
.desk-icon.sel span,.desk-icon:focus-visible span{background:var(--select);text-shadow:none}
.desk-icon.sel canvas{filter:sepia(1) hue-rotate(180deg) saturate(3) brightness(.8)}

/* ---------- windows ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);border:3px solid var(--frame);border-top:0;border-radius:8px 8px 0 0;box-shadow:2px 3px 12px rgba(0,0,0,.45);min-width:0;min-height:0}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-width:0;border-radius:0;box-shadow:none}
.titlebar{flex:none;height:30px;display:flex;align-items:center;gap:3px;padding:0 5px 0 6px;color:#fff;border-radius:7px 7px 0 0;cursor:default;touch-action:none;
  background:linear-gradient(180deg,#0997FF 0%,#0053EE 8%,#0050EE 40%,#0066FF 88%,#0066FF 93%,#005BFF 95%,#003DD7 96%,#003DD7 100%)}
.win.max .titlebar{border-radius:0}
.titlebar .appicon{width:16px;height:16px;image-rendering:pixelated;flex:none}
.title{flex:1;min-width:0;padding-left:3px;font:bold 13px var(--title);letter-spacing:.2px;text-shadow:1px 1px 0 #0A1883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{flex:none;width:21px;height:21px;padding:0;display:grid;place-items:center;border:1px solid #fff;border-radius:3px;cursor:default;
  background:radial-gradient(circle at 85% 85%,#0043D8 0%,#2565E0 45%,#4A82EA 70%,#9DB9F0 92%,#E6EEFC 100%);box-shadow:inset -1px -1px 1px rgba(0,0,0,.25)}
.tbtn.close{background:radial-gradient(circle at 85% 85%,#C23A0A 0%,#DB5A24 45%,#E57A4C 70%,#F6B89C 92%,#FFEDE4 100%)}
.tbtn:hover{filter:brightness(1.13)}
.tbtn:active{filter:brightness(.85)}
.tbtn svg{display:block}

/* ---------- menus ---------- */
.menubar{flex:none;display:flex;flex-wrap:wrap;padding:1px 2px;background:var(--face);border-bottom:1px solid #fff;box-shadow:0 1px 0 var(--shadow)}
.mbar-item{height:19px;padding:0 7px;border:0;background:none;cursor:default}
.mbar-item:hover,.mbar-item.open{background:var(--select);color:var(--select-ink)}
.menu{position:fixed;z-index:1000;min-width:170px;padding:2px;background:#fff;border:1px solid var(--shadow);box-shadow:2px 2px 3px rgba(0,0,0,.3);font:11px var(--ui)}
.mi{display:grid;grid-template-columns:16px 1fr auto 12px;align-items:center;gap:4px;width:100%;height:19px;padding:0 4px 0 3px;border:0;background:none;text-align:left;white-space:nowrap;cursor:default}
.mi .k{padding-left:22px}
.mi .ar.has::after{content:"";display:inline-block;border:4px solid transparent;border-left:4px solid currentColor;border-right:0}
.mi:hover,.mi.open,.mi:focus-visible{background:var(--select);color:var(--select-ink);outline:0}
.mi.dis{color:var(--shadow)}
.mi.dis:hover{background:none;color:var(--shadow)}
.msep{height:1px;margin:3px 1px;background:var(--shadow)}

/* ---------- main area ---------- */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);grid-template-areas:"tools work layers"}
.toolbox{grid-area:tools;width:60px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;border-right:1px solid var(--shadow)}
.tools{display:grid;grid-template-columns:repeat(2,25px)}
.tool{width:25px;height:25px;padding:0;display:grid;place-items:center;border:1px solid transparent;background:none;cursor:default}
.tool:hover{border-color:#fff var(--dkshadow) var(--dkshadow) #fff}
.tool.on{border-color:var(--dkshadow) #fff #fff var(--dkshadow);background:repeating-conic-gradient(#fff 0 25%,var(--face) 0 50%) 0 0/2px 2px}
.tool img{width:16px;height:16px;image-rendering:pixelated;pointer-events:none}
.opts{width:45px;min-height:68px;padding:2px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;border:1px solid;border-color:var(--shadow) #fff #fff var(--shadow)}
.optbtn{padding:0;border:0;background:none;display:block;cursor:default}
.optbtn canvas{display:block;image-rendering:pixelated}
.optbtn.txt{width:39px;height:15px;line-height:15px;text-align:center}
.optbtn.txt.on{background:var(--select);color:var(--select-ink)}

#workArea{grid-area:work;position:relative;min-width:0;min-height:0}
#workspace{position:absolute;inset:0;overflow:auto;background:var(--workspace);border:1px solid;border-color:var(--dkshadow) #fff #fff var(--dkshadow)}
#wrap{position:relative;margin:3px 16px 16px 3px;touch-action:none}
#view,#overlay{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}
#view{background:repeating-conic-gradient(#CCCCCC 0 25%,#FFFFFF 0 50%) 0 0/16px 16px}
#overlay{pointer-events:none}
#grid{position:absolute;left:0;top:0;pointer-events:none;background-image:linear-gradient(to right,rgba(96,96,96,.55) 1px,transparent 1px),linear-gradient(to bottom,rgba(96,96,96,.55) 1px,transparent 1px)}
#selbox{position:absolute;pointer-events:none;outline:1px dashed #000;box-shadow:0 0 0 1px #fff}
#selbox:not(.handles) .sh{display:none}
.sh{position:absolute;width:5px;height:5px;margin:-3px 0 0 -3px;background:#0A246A;pointer-events:auto;touch-action:none}
.sh::after,.ch.on::after{content:"";position:absolute;inset:-6px}
.sh[data-dir=nw]{left:0;top:0;cursor:nwse-resize}.sh[data-dir=n]{left:50%;top:0;cursor:ns-resize}.sh[data-dir=ne]{left:100%;top:0;cursor:nesw-resize}
.sh[data-dir=w]{left:0;top:50%;cursor:ew-resize}.sh[data-dir=e]{left:100%;top:50%;cursor:ew-resize}
.sh[data-dir=sw]{left:0;top:100%;cursor:nesw-resize}.sh[data-dir=s]{left:50%;top:100%;cursor:ns-resize}.sh[data-dir=se]{left:100%;top:100%;cursor:nwse-resize}
.ch{position:absolute;width:3px;height:3px;border:1px solid #0A246A;background:#fff}
.ch.on{background:#0A246A;touch-action:none}
.ch.ch-e{left:100%;top:calc(50% - 1px);cursor:ew-resize}.ch.ch-s{top:100%;left:calc(50% - 1px);cursor:ns-resize}.ch.ch-se{left:100%;top:100%;cursor:nwse-resize}
.ch.ch-n{top:-3px;left:calc(50% - 1px)}.ch.ch-w{left:-3px;top:calc(50% - 1px)}.ch.ch-nw{left:-3px;top:-3px}.ch.ch-ne{left:100%;top:-3px}.ch.ch-sw{left:-3px;top:100%}
#rsGhost{position:absolute;left:0;top:0;outline:1px dotted #000;pointer-events:none}
#textbox{position:absolute;margin:0;padding:0;border:0;outline:1px dashed #000;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;background:transparent}

/* text toolbar */
.fontbar{position:absolute;top:10px;right:18px;z-index:5;background:var(--face);border:2px solid var(--frame);border-top:0;border-radius:5px 5px 0 0;box-shadow:2px 2px 6px rgba(0,0,0,.35);max-width:calc(100% - 20px)}
.ptitle{flex:none;height:18px;display:flex;align-items:center;padding:0 6px;color:#fff;font-weight:bold;background:linear-gradient(180deg,#0997FF 0%,#0053EE 12%,#0050EE 45%,#0066FF 90%,#003DD7 100%)}
.fontbar .ptitle{cursor:move;touch-action:none;border-radius:4px 4px 0 0}
.fb-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:5px 6px}
.fbt{width:23px;height:22px;padding:0;border:1px solid transparent;background:none;cursor:default}
.fbt:hover{border-color:#fff var(--dkshadow) var(--dkshadow) #fff}
.fbt.on{border-color:var(--dkshadow) #fff #fff var(--dkshadow);background:#fff}

/* layers panel */
.layers{grid-area:layers;width:198px;min-height:0;display:flex;flex-direction:column;border-left:1px solid #fff;box-shadow:-1px 0 0 var(--shadow)}
.llist{flex:1 1 auto;min-height:60px;margin:4px 4px 2px;overflow-y:auto;background:#fff;border:1px solid var(--field)}
.lrow{display:flex;align-items:center;gap:6px;padding:3px 5px;border-bottom:1px solid #EFEDE4;cursor:default}
.lrow.on{background:var(--select);color:var(--select-ink)}
.lrow.off .lname{font-style:italic;opacity:.7}
.lthumb{flex:none;width:40px;height:30px;border:1px solid var(--dkshadow);background:repeating-conic-gradient(#D4D4D4 0 25%,#fff 0 50%) 0 0/8px 8px}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrename{flex:1;min-width:0;height:19px}
.lprops{display:grid;grid-template-columns:auto minmax(0,1fr) 34px;align-items:center;gap:4px 6px;padding:3px 6px}
.lprops select{grid-column:2 / 4;min-width:0}
.lprops output{text-align:right;font-variant-numeric:tabular-nums}
.lbtns{display:flex;flex-wrap:wrap;gap:1px;padding:2px 4px 5px}
.lbtn{width:25px;height:24px;padding:0;display:grid;place-items:center;border:1px solid transparent;background:none;cursor:default}
.lbtn:hover:not(:disabled){border-color:#fff var(--dkshadow) var(--dkshadow) #fff}
.lbtn:active:not(:disabled){border-color:var(--dkshadow) #fff #fff var(--dkshadow)}
.lbtn img{width:16px;height:16px;image-rendering:pixelated}
.lbtn:disabled img{opacity:.3}

/* colour box + status */
.colorbox{flex:none;display:flex;align-items:flex-start;gap:4px;padding:4px 4px 5px;border-top:1px solid #fff;box-shadow:0 -1px 0 var(--shadow)}
.cind{position:relative;flex:none;width:32px;height:34px;padding:0;border:1px solid;border-color:var(--shadow) #fff #fff var(--shadow);background:repeating-conic-gradient(#fff 0 25%,var(--face) 0 50%) 0 0/2px 2px;cursor:default}
.cfg,.cbg{position:absolute;width:15px;height:15px;border:1px solid;border-color:var(--dkshadow) #fff #fff var(--dkshadow)}
.cfg{left:3px;top:3px;z-index:1}
.cbg{left:11px;top:13px}
.palette{display:grid;grid-template-columns:repeat(14,16px);grid-auto-rows:16px}
.sw{width:16px;height:16px;padding:0;border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040;cursor:default}
.statusbar{flex:none;display:flex;gap:2px;height:22px;padding:2px 14px 2px 2px}
.sb-msg{flex:1;min-width:0;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-f{flex:none;width:86px;padding:2px 4px;white-space:nowrap;overflow:hidden;border:1px solid;border-color:var(--shadow) #fff #fff var(--shadow);font-variant-numeric:tabular-nums}

/* ---------- taskbar ---------- */
#taskbar{flex:none;height:30px;display:flex;align-items:stretch;color:#fff;position:relative;z-index:20;
  background:linear-gradient(180deg,#1F2F86 0,#3165C4 3%,#3682E5 6%,#4490E6 10%,#3883E5 12%,#2B71E0 15%,#2663DA 18%,#235BD6 20%,#2258D5 23%,#2157D6 38%,#245DDB 54%,#2562DF 86%,#245FDC 89%,#2158D4 92%,#1D4EC0 95%,#1941A5 98%)}
.start{flex:none;display:flex;align-items:center;gap:6px;padding:0 20px 2px 10px;border:0;border-radius:0 12px 12px 0;color:#fff;font:italic bold 17px/1 var(--title);text-shadow:1px 1px 1px rgba(0,0,0,.6);cursor:default;
  background:linear-gradient(180deg,#3C8F3C 0%,#5DC25D 9%,#45A845 40%,#379837 75%,#2D822D 100%);box-shadow:inset -3px 0 4px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.4)}
.start:hover{filter:brightness(1.08)}
.start canvas{width:20px;height:20px;image-rendering:pixelated}
.tasks{flex:1;min-width:0;display:flex;gap:3px;padding:3px 6px}
.task{width:170px;min-width:0;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #1C47B0;border-radius:3px;color:#fff;cursor:default;white-space:nowrap;overflow:hidden;
  background:linear-gradient(180deg,#5A9AF6 0%,#3C81F3 15%,#3B7EF0 85%,#2E6CD8 100%);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3)}
.task span{overflow:hidden;text-overflow:ellipsis}
.task.active{background:#1E52B7;box-shadow:inset 1px 1px 2px rgba(0,0,0,.55)}
.task img{width:16px;height:16px;image-rendering:pixelated;flex:none}
.tray{flex:none;display:flex;align-items:center;padding:0 12px;border-left:1px solid #092E8D;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#0C59B9 0,#139EE9 5%,#18B5F2 10%,#139BEB 14%,#1290E8 19%,#0D8DEA 63%,#0D9FF1 81%,#0F9EED 88%,#119BE9 91%,#1392E2 94%,#137ED7 97%,#095BC9 100%);box-shadow:inset 1px 0 1px #18BBFF}
.startmenu{position:absolute;left:0;bottom:30px;z-index:30;width:250px;background:#fff;border:2px solid var(--frame);border-bottom:0;border-radius:7px 7px 0 0;box-shadow:3px 0 8px rgba(0,0,0,.4);overflow:hidden}
.sm-head{height:46px;display:flex;align-items:center;gap:9px;padding:0 10px;color:#fff;font:bold 14px var(--title);text-shadow:1px 1px 1px rgba(0,0,0,.5);background:linear-gradient(180deg,#1868CE 0%,#0E60CB 15%,#0B57BD 85%,#0A4CA8 100%)}
.sm-head canvas{width:32px;height:32px;image-rendering:pixelated;border:2px solid #fff;border-radius:3px;background:#fff}
.sm-body{padding:6px 0}
.sm-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border:0;background:none;text-align:left;cursor:default}
.sm-item img{width:16px;height:16px;image-rendering:pixelated}
.sm-item:hover,.sm-item:focus-visible{background:var(--select);color:#fff;outline:0}
.sm-foot{height:8px;background:linear-gradient(180deg,#4282D6,#3168C3)}

/* ---------- dialogs ---------- */
.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:12px}
.win.dialog{position:relative;max-width:100%;max-height:100%}
.dialog .titlebar{height:26px}
.dialog .title{font-size:12px}
.dlg-body{padding:12px 12px 4px;overflow:auto;min-height:0}
.dlg-btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;padding:8px 12px 12px}
.xpbtn{min-width:75px;height:23px;padding:0 10px;border:1px solid #003C74;border-radius:3px;cursor:default;background:linear-gradient(180deg,#FFFFFF 0%,#ECEBE6 86%,#D6D0C5 100%)}
.xpbtn.default,.xpbtn:focus-visible{box-shadow:inset 0 0 0 1px #CEE7FF,inset 0 0 0 2px #98B8EA;outline:0}
.xpbtn:hover{box-shadow:inset 0 0 0 1px #FFF0CF,inset 0 0 0 2px #F8B330}
.xpbtn:active{background:linear-gradient(180deg,#E5E4DE 0%,#E3E2DA 85%,#F2F1EE 100%)}
input[type=text],input[type=number],select{height:21px;padding:1px 3px;border:1px solid var(--field);border-radius:0;background:#fff;color:#000}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;flex:none;width:13px;height:13px;margin:0;display:inline-grid;place-content:center;vertical-align:-2px;border:1px solid #1C5180;background:linear-gradient(135deg,#DCDCD7,#FFFFFF)}
input[type=radio]{border-radius:50%}
input[type=checkbox]:checked::before{content:"";width:7px;height:4px;border-left:2px solid #21A121;border-bottom:2px solid #21A121;transform:translateY(-1px) rotate(-45deg)}
input[type=radio]:checked::before{content:"";width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6DE06D,#178A17)}
input:disabled{opacity:.45}
input[type=range]{accent-color:var(--select);width:100%;min-width:0;margin:0}
fieldset{margin:0 0 8px;padding:6px 10px 8px;border:1px solid #D0D0BF;border-radius:3px}
legend{padding:0 3px;color:#0046D5}
.form{display:grid;gap:8px}
.frow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.frow label{display:inline-flex;align-items:center;gap:5px}
.frow input[type=number]{width:64px}
.note{margin:0;color:#444}
.err{margin:0;color:#B00000;min-height:14px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}
.msg p{margin:6px 0 0;white-space:pre-line;max-width:42ch}
.ec{display:grid;grid-template-columns:auto auto;gap:14px;align-items:start}
.ec-grid{display:grid;grid-template-columns:repeat(8,20px);gap:4px}
.ec-sw{width:20px;height:16px;padding:0;border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040;cursor:default}
.ec-sw.on{outline:1px dotted #000;outline-offset:1px}
.ec-prev{width:72px;height:48px;border:1px solid;border-color:#808080 #fff #fff #808080}
.ec-side{display:grid;gap:6px}
.ec-side input[type=number]{width:52px}
.ec-side input[type=color]{width:72px;height:26px;padding:0;border:1px solid var(--field);background:#fff}
.saveprev{display:block;max-width:100%;max-height:220px;margin:10px auto 0;border:1px solid var(--field);background:repeating-conic-gradient(#D4D4D4 0 25%,#fff 0 50%) 0 0/12px 12px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.help{margin:0;padding-left:18px;display:grid;gap:5px;max-width:52ch}
.about{display:flex;gap:14px;align-items:flex-start;max-width:44ch}
.about canvas{width:48px;height:48px;image-rendering:pixelated;flex:none}
.about h2{margin:0 0 4px;font:bold 15px var(--title)}
.about p{margin:0 0 6px}
.viewbmp{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:auto;background:#004E98;cursor:default}
.viewbmp img{image-rendering:pixelated;max-width:none}

@media (max-width:720px){
  #win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-width:0;border-radius:0;box-shadow:none}
  .titlebar{border-radius:0}
  .main{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"tools work" "layers layers"}
  .layers{width:auto;max-height:152px;border-left:0;box-shadow:0 -1px 0 var(--shadow)}
  .llist{min-height:44px}
  .lthumb{width:32px;height:24px}
  .lprops{grid-template-columns:auto minmax(0,1fr) 34px auto minmax(0,1fr)}
  .lprops select{grid-column:auto}
  .sb-f{width:66px}
  .fontbar{right:8px;top:8px}
  .task{width:auto;flex:1 1 auto;max-width:170px}
  .desk-icon{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="desktop">
  <button id="deskIcon" class="desk-icon" type="button" aria-label="Paint (double-click to open)"><canvas id="deskIconImg" width="16" height="16"></canvas><span>Paint</span></button>

  <div id="win" class="win max">
    <div class="titlebar" id="titlebar">
      <img class="appicon" id="appIcon" alt="">
      <span class="title" id="winTitle">untitled - Paint</span>
      <button class="tbtn" id="btnMin" type="button" aria-label="Minimize" title="Minimize"><svg width="13" height="13" viewBox="0 0 13 13"><rect x="2" y="9" width="7" height="3" fill="#fff"/></svg></button>
      <button class="tbtn" id="btnMax" type="button" aria-label="Restore Down" title="Restore Down"><svg id="maxGlyph" width="13" height="13" viewBox="0 0 13 13"></svg></button>
      <button class="tbtn close" id="btnClose" type="button" aria-label="Close" title="Close"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M2.5 2.5l8 8M10.5 2.5l-8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="square"/></svg></button>

    const L = doc.layers[i];
    const cb = h('input', { type: 'checkbox', title: 'Show or hide this layer', 'aria-label': `Show ${L.name}` });
    cb.checked = L.visible;
    cb.addEventListener('pointerdown', e => e.stopPropagation());
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => toggleVis(i));
    const th = h('canvas', { class: 'lthumb', width: 80, height: 60 });
    thumbs.set(L.id, th);
    const nm = h('span', { class: 'lname', title: 'Double-click to rename' }, L.name);
    const row = h('div', { class: 'lrow' + (L.visible ? '' : ' off'), role: 'option', tabindex: '0', 'data-i': i }, cb, th, nm);
    row.addEventListener('click', () => setActive(i));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActive(i); } else if (e.key === 'F2') { e.preventDefault(); startRename(i, nm); } });
    nm.addEventListener('dblclick', e => { e.stopPropagation(); startRename(i, nm); });

}
function markActiveRow() {
  llist.querySelectorAll('.lrow').forEach(r => { const on = +r.dataset.i === doc.active; r.classList.toggle('on', on); r.setAttribute('aria-selected', on ? 'true' : 'false'); });

}

}
function setActive(i) {

}
function startRename(i, nm) {

    renderLayers();

  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); else if (e.key === 'Escape') fin(false); });

}
function toggleVis(i) { settle(); pushHistory(); doc.layers[i].visible = !doc.layers[i].visible; renderLayers(); requestRender(); }
function addLayer() { settle(); pushHistory(); const L = makeLayer(`Layer ${++S.layerCount}`, doc.w, doc.h); doc.layers.splice(doc.active + 1, 0, L); doc.active++; renderLayers(); requestRender(); }

/* ================= document-level operations ================= */

      g.fillStyle = css(S.secondary);

      if (hh > doc.h) g.fillRect(0, doc.h, w, hh - doc.h);

/* ================= clipboard ================= */
const hasSel = () => !!S.sel;

  } catch (_) { return Promise.reject(); }
}

function cmdPasteMenu() { if (S.clip) pasteImage(S.clip); else status('To paste a picture from another program, press Ctrl+V.'); }
function pasteImage(img) {

    settle();

      { label: 'No', action: go },

/* ================= files ================= */
function loadImageFile(f) {
  return new Promise((res, rej) => {
    if (!f) { rej(); return; }
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
const baseName = f => (f && f.name ? f.name.replace(/\.[^.]+$/, '') : 'untitled') || 'untitled';
function badFile() { msgBox('Paint cannot read this file.\nThis is not a valid bitmap file, or its format is not currently supported.', [{ label: 'OK', default: true }], 'warn'); }
function pickFile(input) { input.value = ''; input.click(); }

$('fileLayer').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadImageFile(f).then(img => importLayer(img, baseName(f)), badFile); });

/* ================= autosave (this browser only) ================= */
let saveTimer = 0;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1200); }
function saveNow() {
  if (S.op) { scheduleSave(); return; }
  try {
    const data = { v: 1, w: doc.w, h: doc.h, active: doc.active, name: doc.name, layerCount: S.layerCount, dirty: doc.dirty,
      primary: S.primary, secondary: S.secondary, palette: S.palette, custom: S.custom,
      layers: doc.layers.map(l => ({ name: l.name, visible: l.visible, opacity: l.opacity, blend: l.blend, png: l.canvas.toDataURL() })) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (_) {}
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function loadSaved() {
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (_) { return false; }
  if (!data || data.v !== 1 || !Array.isArray(data.layers) || !data.layers.length) return false;
  const w = clamp(data.w | 0, 1, MAXDIM), hh = clamp(data.h | 0, 1, MAXDIM);
  const imgs = await Promise.all(data.layers.map(l => loadImg(l.png)));
  doc.w = w; doc.h = hh; doc.name = String(data.name || 'untitled'); doc.dirty = !!data.dirty;
  doc.layers = data.layers.map((l, i) => {
    const L = makeLayer(String(l.name || `Layer ${i + 1}`), w, hh); g2(L.canvas).drawImage(imgs[i], 0, 0);
    L.visible = l.visible !== false; L.opacity = clamp(+l.opacity || 0, 0, 1); if (l.opacity == null) L.opacity = 1;
    L.blend = BLENDS.some(b => b[0] === l.blend) ? l.blend : 'source-over';
    return L;
  });
  doc.active = clamp(data.active | 0, 0, doc.layers.length - 1);
  S.layerCount = Math.max(doc.layers.length, data.layerCount | 0);
  const okC = c => Array.isArray(c) && c.length === 3 && c.every(v => Number.isInteger(v) && v >= 0 && v <= 255);
  if (okC(data.primary)) S.primary = data.primary;
  if (okC(data.secondary)) S.secondary = data.secondary;
  const okHex = a => Array.isArray(a) && a.every(x => /^#[0-9A-F]{6}$/i.test(x));
  if (okHex(data.palette) && data.palette.length === 28) S.palette = data.palette.map(x => x.toUpperCase());

}

      if (!opts.canvas) { doc.name = nameIn.value.trim() || 'untitled'; doc.dirty = false; updateTitle(); scheduleSave(); }
      if (opts.after) opts.after();
    } }
  ] });
}
function helpDlg() {
  const tips = [
    'Left-click paints with the foreground color, right-click with the background color.',
    'Right-click while dragging (or press Esc) to cancel the stroke you are drawing.',
    'Click the two overlapping squares beside the color box to swap colors. Double-click a color to edit it.',
    'Hold Shift to draw perfect squares, circles and 45° lines.',
    'Drag a selection to move it. Ctrl+drag leaves a copy behind; Shift+drag smears it. Drag its blue handles to stretch it.',
    'With the Eraser, right-drag replaces the foreground color with the background color.',
    'Curve: drag a line, then click or drag twice to bend it. Polygon: drag the first side, click for each corner, and double-click or click the start to close it.',
    'Every tool paints on the highlighted layer. Tick a layer’s box to show or hide it; double-click its name to rename it.',
    'On the bottom layer the Eraser paints the background color; on other layers it erases to transparent.',
    'Drop a picture file on the canvas to add it as a new layer, or press Ctrl+V to paste one.',
    'Your picture and layers are kept in this browser between visits. File > New starts over.'
  ];
  openDialog({ title: 'Paint Help', body: h('ul', { class: 'help' }, tips.map(t => h('li', {}, t))), width: 460, buttons: [{ label: 'OK', default: true }] });
}
function aboutDlg() {
  const ic = h('canvas', { width: 16, height: 16 }); iconCanvasInto(ic, 'app');
  openDialog({ title: 'About Paint', width: 380, buttons: [{ label: 'OK', default: true }], body: h('div', { class: 'about' }, ic, h('div', {},
    h('h2', {}, 'Paint, now with layers'),
    h('p', {}, 'Version 5.1 · Build 2600, more or less.'),
    h('p', {}, 'A tribute to the paint program that came with Windows XP: aliased pixels, the 28-color box, Draw Opaque, and the curve tool everyone fought with.'),
    h('p', { class: 'note' }, 'Not affiliated with or endorsed by Microsoft.'))) });
}
function viewBitmap() {
  settle();
  const c = composite(false);
  const img = h('img', { src: c.toDataURL(), alt: 'Full view of the picture' });
  const layer = h('div', { class: 'viewbmp', title: 'Click or press any key to return' }, img);
  const close = () => { layer.remove(); document.removeEventListener('keydown', kd, true); };
  const kd = e => { e.preventDefault(); e.stopPropagation(); close(); };
  layer.addEventListener('pointerdown', e => { e.stopPropagation(); close(); });
  document.addEventListener('keydown', kd, true);
  document.body.append(layer);
}

/* ================= keyboard ================= */
function isTyping(t) {
  if (!t || !t.tagName) return false;
  if (t.isContentEditable) return true;
  if (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return true;
  return t.tagName === 'INPUT' && !['checkbox', 'radio', 'range', 'button'].includes(t.type);
}
document.addEventListener('keydown', e => {
  if (S.modal) return;
  if (e.key === 'Escape') {
    if (menuState) { closeMenus(); return; }
    const sm = $('startMenu'); if (!sm.hidden) { sm.hidden = true; return; }
    if (S.text) { e.preventDefault(); commitText(); return; }
    if (S.op) { cancelOp(); return; }
    if (S.curve || S.poly) { S.curve = S.poly = null; clearOverlay(); return; }
    if (S.sel) { commitFloat(); S.sel = null; updateSelUI(); setSize(); requestRender(); }
    return;
  }
  if (isTyping(e.target)) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey) {
    if (k === 'v') return; // the paste event handles it
    const map = { o: cmdOpen, s: () => saveDlg(), z: e.shiftKey ? redo : undo, y: redo, x: cmdCut, c: cmdCopy, a: cmdSelectAll,
                  r: flipDlg, e: attrDlg, i: cmdInvert, g: toggleGrid, f: viewBitmap, l: () => toggleView('colors'), m: mergeDown };
    const fn = map[k];
    if (fn) { e.preventDefault(); closeMenus(); fn(); }
    return;
  }
  if (k === 'delete') { e.preventDefault(); cmdClearSel(); }
});

/* ================= window & taskbar ================= */
function updateMaxGlyph() {
  const max = win.classList.contains('max');
  $('maxGlyph').innerHTML = max
    ? '<rect x="4.5" y="1.5" width="7" height="6" fill="none" stroke="#fff"/><rect x="4" y="1" width="8" height="2" fill="#fff"/><rect x="1.5" y="5.5" width="7" height="6" fill="#0000" stroke="#fff"/><rect x="1" y="5" width="8" height="2" fill="#fff"/>'
    : '<rect x="1.5" y="2.5" width="10" height="9" fill="none" stroke="#fff"/><rect x="1" y="2" width="11" height="3" fill="#fff"/>';
  $('btnMax').setAttribute('aria-label', max ? 'Restore Down' : 'Maximize');
  $('btnMax').title = max ? 'Restore Down' : 'Maximize';
}
function toggleMax() {
  if (win.classList.contains('max')) {
    const d = desktop.getBoundingClientRect();
    if (!win.style.width) {
      win.style.width = Math.min(1000, Math.max(480, d.width - 120)) + 'px';
      win.style.height = Math.min(700, Math.max(360, d.height - 60)) + 'px';
      win.style.left = '60px'; win.style.top = '20px';
    }
    win.classList.remove('max');
  } else win.classList.add('max');
  updateMaxGlyph(); closeMenus();
}
function updateTask() {
  const tb = $('taskBtn');
  tb.hidden = S.closed;
  tb.classList.toggle('active', !win.hidden);
}
function minimizeWin() { settle(); closeMenus(); win.hidden = true; updateTask(); }
function restoreWin() { win.hidden = false; S.closed = false; updateTask(); $('startMenu').hidden = true; }
function closeWindow() { settle(); closeMenus(); win.hidden = true; S.closed = true; updateTask(); saveNow(); }
$('btnMin').addEventListener('click', minimizeWin);
$('btnMax').addEventListener('click', toggleMax);
$('btnClose').addEventListener('click', closeWindow);
$('titlebar').addEventListener('dblclick', e => { if (!e.target.closest('.tbtn')) toggleMax(); });
$('titlebar').addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.tbtn') || win.classList.contains('max') || innerWidth <= 720) return;
  e.preventDefault();
  const r = win.getBoundingClientRect(), d = desktop.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
  drag(e, ev => {
    win.style.left = clamp(ev.clientX - d.left - ox, 80 - r.width, d.width - 80) + 'px';
    win.style.top = clamp(ev.clientY - d.top - oy, 0, Math.max(0, d.height - 30)) + 'px';
  });
});
$('taskBtn').addEventListener('click', () => { if (win.hidden) restoreWin(); else minimizeWin(); });
const deskIcon = $('deskIcon');
deskIcon.addEventListener('click', e => { deskIcon.classList.add('sel'); if (e.detail === 0) restoreWin(); });
deskIcon.addEventListener('dblclick', restoreWin);
deskIcon.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') restoreWin(); });
desktop.addEventListener('pointerdown', e => { if (!e.target.closest('#deskIcon')) deskIcon.classList.remove('sel'); });
$('startBtn').addEventListener('click', () => { const sm = $('startMenu'); sm.hidden = !sm.hidden; if (!sm.hidden) $('smPaint').focus(); });
$('smPaint').addEventListener('click', restoreWin);
$('smHelp').addEventListener('click', () => { $('startMenu').hidden = true; helpDlg(); });
$('smAbout').addEventListener('click', () => { $('startMenu').hidden = true; aboutDlg(); });
function tick() {
  const d = new Date(); let hr = d.getHours(); const ap = hr >= 12 ? 'PM' : 'AM'; hr = hr % 12 || 12;
  $('clock').textContent = `${hr}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`;
}

/* ================= boot ================= */
async function init() {
  $('appIcon').src = ICON_URL.app; $('taskIcon').src = ICON_URL.app; $('smPaintIcon').src = ICON_URL.app;
  $('smHelpIcon').src = ICON_URL.help; $('smAboutIcon').src = ICON_URL.info;
  iconCanvasInto($('deskIconImg'), 'app'); iconCanvasInto($('startIcon'), 'app'); iconCanvasInto($('smIcon'), 'app');
  buildToolbox(); buildMenubar(); buildLayersPanel(); buildFontbar(); buildHandles();
  updateMaxGlyph(); tick(); setInterval(tick, 15000);
  let ok = false;
  try { ok = await loadSaved(); } catch (_) { ok = false; }
  if (!ok) { doc.layers = []; nextLayerId = 1; buildSample(); }
  renderPalette(); applyView();
  layoutCanvas(); renderLayers(); setTool('pencil', true); updateColorsUI(); updateTitle(); status();
  requestRender();
}
init();
})();
</script>
